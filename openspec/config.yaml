schema: spec-driven

context: |
  - Target platform: Zephyr RTOS v4.5.0 (workspace manifest in manifest/west.yml) on STM32H503CBT6 (LQFP48, 32 KB SRAM, 128 KB Flash, 250 MHz Cortex-M33).
  - Hardware architecture: Digital Controller Baseboard (20261110-底板) + Analog Daughterboard (20261110-MZM) connected via 30-pin FPC2. Legacy single-board hardware compatibility is explicitly out of scope.
  - Two-axis extensibility: swappable MCU boards under boards/xidian/<board>/ and swappable analog daughterboards via analog_board_ops_t + U21 P24C02A EEPROM descriptor.
  - Hard resource budgets: static RAM <= 24576 B (24 KiB), Flash <= 110592 B (108 KiB), verified via scripts/check_mem_budget.py.
  - Guardrails: never read/write /tmp (use .agent-bridge/), fast-fail without silent fallbacks, never auto-rollback Git.
  - Documentation sync rule: any design, hardware, interface, CLI/UI, or feature change MUST update the relevant pages under docs/README.md (docs/architecture.md including its changelog, docs/design/{optical,electrical,mechanical,algorithm,pcb-errata}.md, docs/experiments/), docs/user-guide.md, and README.md in the same change/commit.

rules:
  design:
    - Explicitly state cross-domain opto-electronic impacts across docs/design/{optical,electrical,mechanical,algorithm,pcb-errata}.md and docs/experiments/ when hardware, DSP, control, CLI, or UI interfaces change.
  tasks:
    - Each task checkbox line must use `- [ ] <task_id> <title>` followed by indented `owned:`, `depends:`, and `verify:` metadata for bridge_ctl.py sync-openspec.
    - Keep Phase 1 Baseboard Bring-Up strictly decoupled from Phase 2 Analog Daughterboard integration.
    - Every feature or design task MUST include all affected docs/ and README.md paths from the AGENTS.md impact matrix in `owned:` and append `&& python3 scripts/check_repo_hygiene.py --working-tree --strict-doc-sync` to its `verify:` command.
